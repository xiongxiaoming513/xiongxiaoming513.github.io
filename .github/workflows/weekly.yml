name: 每周摘要

# 每周日 20:00（北京时间 = UTC 12:00）自动汇总上周动态，写入 docs/weekly-log.md。
# 注意：GitHub 在仓库连续 60 天无活动时会自动停用定时任务。
on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    name: 生成每周摘要
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 生成摘要
        run: node scripts/weekly-digest.mjs --write

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/weekly-log.md
          if git diff --cached --quiet; then
            echo "本周摘要已存在，无变更"
          else
            git commit -m "chore(digest): 每周摘要 $(date -u +%G-W%V)"
            git push
          fi
